[project]
name = "emulator-ble-server"
version = "0.1.0"
description = "Fake Bluetooth LE peripherals for the Android emulator: Bumble devices on netsim, driven by reactivex timers."
readme = "README.md"
authors = [
    { name = "psychowasp", email = "psychowaspx@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "bumble>=0.0.236",
    "grpcio>=1.85.1",
    "protobuf>=7.36.2",
    "reactivex>=6.1.0",
]

[project.scripts]
emulator-ble-server = "emulator_ble_server:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
